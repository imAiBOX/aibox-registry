name: CI

on:
  push:
  pull_request:
  schedule:
    # daily upstream probe: 04:00 UTC
    - cron: '0 4 * * *'

permissions:
  contents: read
  issues: write

jobs:
  validate:
    name: Schema + locale parity
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dev deps
        run: npm ci
      - name: Validate index.json + apps/*.json (JSON Schema, invariants V1-V3)
        run: node scripts/validate.mjs
      - name: Locale key parity (en baseline vs zh-CN and any future pack)
        run: node scripts/check-locales.mjs
      - name: Unit tests (auto-bump helpers)
        run: node --test

  sanitization:
    name: Sanitization scan (full history)
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Scan full history for internal references
        run: node scripts/prepush-scan.mjs --history

  dispatch-site:
    name: Trigger aibox-site rebuild
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: repository_dispatch → aibox-site (registry-updated)
        env:
          PAT: ${{ secrets.DISPATCH_PAT }}
        run: |
          set -euo pipefail
          code=$(curl -sS -X POST \
            -H "Authorization: Bearer $PAT" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/imAiBOX/aibox-site/dispatches \
            -d '{"event_type":"registry-updated","client_payload":{"sha":"${{ github.sha }}"}}' \
            -o /dev/null -w '%{http_code}')
          echo "dispatch HTTP $code"
          test "$code" = "204"

  probe:
    name: Upstream liveness probe
    if: github.event_name == 'push' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    # auto-bump pushes chore/upstream-* branches and opens same-repo PRs with
    # the default GITHUB_TOKEN (no PAT); issues: write keeps the fallback flow
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Probe channels / versions / gateways (HEAD 10s, sha256 for <5MB, releases/latest)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/probe.mjs
      - name: Open bump PRs for new upstream versions (A-class drifts)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/auto-bump.mjs
      - name: Upload probe report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-report
          path: |
            probe-report.json
            drifts.json
            auto-bumps.json
          if-no-files-found: ignore
      - name: "File issues on drift (label upstream-drift) and fail the run"
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          drift_count=0
          if [ -s drifts.json ]; then drift_count=$(jq length drifts.json); fi
          bump_count=0
          if [ -s auto-bumps.json ]; then bump_count=$(jq length auto-bumps.json); fi
          echo "drift items: $drift_count, bump PRs: $bump_count"
          if [ "$drift_count" -gt 0 ]; then
            gh label create upstream-drift \
              --color E5484D \
              --description "Daily probe detected upstream/mirror drift" \
              --force || true
            gh issue list --state open --label upstream-drift --limit 200 --json title > open-issues.json || echo '[]' > open-issues.json
            tmp=$(mktemp)
            while IFS= read -r item; do
              title=$(jq -r '.title' <<<"$item")
              jq -r '.body' <<<"$item" > "$tmp"
              exists=$(jq -r --arg t "$title" 'any(.[]; .title == $t)' open-issues.json)
              if [ "$exists" = "true" ]; then
                echo "already open, skip: $title"
                continue
              fi
              echo "filing: $title"
              gh issue create --title "$title" --body-file "$tmp" --label upstream-drift \
                || gh issue create --title "$title" --body-file "$tmp" \
                || echo "issue create failed (continuing)"
            done < <(jq -c '.[]' drifts.json)
          fi
          # stay red while anything drifts or a bump PR awaits review
          if [ "$drift_count" -gt 0 ] || [ "$bump_count" -gt 0 ]; then
            exit 1
          fi
          exit 0
